<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tây Du Ký</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- PWA trên iOS: chạy toàn màn hình khi "Thêm vào MH chính" -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tây Du Ký">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#1d130e">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ===== Màn chào (mở khoá âm thanh trên iPhone) ===== -->
  <section id="scr-splash" class="screen">
    <canvas id="fire-bg" aria-hidden="true"></canvas>
    <div class="sp-hero" aria-hidden="true"><div class="sp-glow"></div><img id="sp-wukong" alt=""><img id="sp-cloud" alt=""></div>
    <div class="sp-top">
      <div class="sp-logo" id="sp-logo" role="img" aria-label="Tây Du Ký"></div>
      <p class="logo-sub">Tám mươi mốt kiếp nạn · Tây Thiên thỉnh kinh</p>
    </div>
    <div class="sp-ring" id="sp-ring">
      <svg class="sp-ring-art" viewBox="0 0 300 300" aria-hidden="true"></svg>
      <button class="sp-orb o-reg" data-go="register"><i>✍</i><span>Đăng ký</span></button>
      <button class="sp-orb o-login" data-go="login"><i>⛩</i><span>Đăng nhập</span></button>
      <button class="sp-orb o-rec" data-go="recover"><i>🗝</i><span>Khôi phục</span></button>
      <button class="sp-go tap-start" id="tap-start"><b>VÀO</b><small>Bắt đầu</small></button>
    </div>
    <p class="splash-note" id="splash-note">Đang kết nối máy chủ…</p>
  </section>

  <!-- ===== Màn hình đăng nhập ===== -->
  <section id="scr-login" class="screen" hidden>
    <div class="scene" id="login-bg"></div>
    <div class="mist-layer m1"></div><div class="mist-layer m2"></div>
    <div class="login-body">
      <h1 class="logo small"><span class="logo-a">Tây Du</span><span class="logo-b">Ký</span></h1>
      <form id="f-login" class="scroll-card ornate" autocomplete="on">
        <div class="seg seg3">
          <button type="button" class="seg-b on" data-mode="login">Đăng nhập</button>
          <button type="button" class="seg-b" data-mode="register">Đăng ký</button>
          <button type="button" class="seg-b" data-mode="recover">Khôi phục</button>
        </div>
        <label>Tên đăng nhập<input name="user" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
        <label class="rc-only" hidden>Mã khôi phục<input name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" maxlength="9"></label>
        <label><span id="pass-lbl">Mật khẩu</span><input name="pass" type="password" autocomplete="current-password" required></label>
        <button class="btn-seal wide" type="submit" id="b-login">Vào game</button>
        <button type="button" class="link-back" id="b-back">‹ Trở về màn chính</button>
        <p class="form-err" id="login-err" role="alert"></p>
      </form>
      <p class="install-hint" id="install-hint" hidden>Chơi toàn màn hình: bấm <b>Chia sẻ</b> rồi chọn <b>Thêm vào MH chính</b>.</p>
    </div>
  </section>

  <!-- ===== Tạo nhân vật ===== -->
  <section id="scr-create" class="screen" hidden>
    <div class="scene dim" id="create-bg"></div>
    <div class="create-wrap cs">
      <div class="cs-head"><b id="cs-title">Chọn Nhân Vật</b></div>
      <div class="cs-top">
        <div class="cs-stage">
          <div class="cr-aura" id="cr-aura"></div>
          <svg class="cr-circle" viewBox="0 0 200 60" aria-hidden="true"><ellipse cx="100" cy="30" rx="96" ry="26" fill="none" stroke="#ffd76a" stroke-width="1.6"/><ellipse cx="100" cy="30" rx="80" ry="20" fill="none" stroke="#ffd76a" stroke-width=".8" stroke-dasharray="3 4"/><ellipse cx="100" cy="30" rx="60" ry="14" fill="rgba(255,215,106,.18)"/></svg>
          <img id="create-hero" alt="">
        </div>
        <div class="cs-side">
          <div class="cs-portrait"><img id="cs-face" alt=""></div>
          <div class="cs-meta"><span>Phái: <b id="cs-phai"></b></span><span>Giới: <b id="cs-gioi"></b></span></div>
          <div class="cs-lore"><b id="cs-name"></b><small id="cs-lore"></small></div>
        </div>
      </div>
      <div class="cs-cols" id="race-list"></div>
      <div class="cr-info ornate-gold" id="cr-info"></div>
      <div class="create-foot scroll-card ornate" id="cs-foot">
        <label>Đạo hiệu<span class="cr-name"><input id="c-name" maxlength="12" placeholder="2–12 ký tự" autocomplete="off"><button type="button" class="cr-dice" id="c-dice" aria-label="Tên ngẫu nhiên">🎲</button></span></label>
        <p class="form-err" id="create-err" role="alert"></p>
      </div>
      <div class="cs-bar"><button type="button" id="b-create">Chọn</button><button type="button" id="b-random">Ngẫu nhiên</button></div>
    </div>
  </section>

  <!-- ===== Màn hình chính ===== -->
  <section id="scr-game" class="screen paint-ui" hidden>
    <header class="hud">
      <button class="hud-ava" id="hud-ava" aria-label="Nhân vật"><img id="hud-img" alt=""><span class="hud-lvl" id="hud-lv"></span></button>
      <div class="hud-mid">
        <div class="hud-name"><span id="hud-name"></span><span class="hud-pow" id="hud-pow"></span></div>
        <div class="bar hp"><i id="hud-hp"></i><span id="hud-hpt"></span></div>
        <div class="bar mp"><i id="hud-mp"></i><span id="hud-mpt"></span></div>
        <div class="bar xp"><i id="hud-xp"></i></div>
      </div>
      <div class="hud-money">
        <span title="Bạc"><b class="coin silver"></b><em id="hud-bac"></em></span>
        <span title="Vàng"><b class="coin gold"></b><em id="hud-vang"></em></span>
        <span title="Túi đồ" class="hud-bag"><b>🎒</b><em id="hud-bag"></em></span>
      </div>
      <button class="hud-gear" id="hud-gear" aria-label="Cài đặt"></button>
    </header>
    <div class="hud-sub">
      <button class="map-chip" id="map-chip"><span id="map-name"></span></button>
      <button class="quest-track" id="quest-track"></button>
    </div>

    <div class="map-wrap" id="map-wrap">
      <canvas id="map3d"></canvas>
      <canvas id="map"></canvas>
      <div class="map-title" id="map-title"></div>
      <div class="pt-badge" id="pt-badge" hidden></div>
      <div class="mm" id="mm"><canvas id="mm-cv" width="208" height="208"></canvas><i class="mm-n">N</i></div>
      <button class="evt-tog" id="evt-tog" aria-label="Tiện ích"><span>✦</span><b>Tiện ích</b></button>
      <div class="evts">
        <button class="evt r" id="evt-welfare"><span class="ic">🧧</span><b>Phúc Lợi</b></button>
        <button class="evt" id="evt-daily"><span class="ic">📜</span><b>Điểm danh</b></button>
        <button class="evt b" id="evt-act"><span class="ic">🎁</span><b>Hoạt động</b></button>
      </div>
      <div class="evts rt">
        <button class="evt sm g" id="evt-pass"><span class="ic">🏮</span><b>Tu Hành</b></button>
        <button class="evt sm j" id="evt-dg"><span class="ic">🏯</span><b>Phó Bản</b></button>
        <button class="evt sm v" id="evt-than"><span class="ic">✨</span><b>Thần Sủng</b></button>
      </div>
      <button class="wev" id="wev" aria-label="Thiên Địa Dị Tượng"></button>
      <div class="dbtns">
        <button class="dbtn" id="btn-menu"><span class="ic" data-i="gear"></span><b>Menu</b></button>
        <button class="dbtn" id="btn-quick"><span class="ic" data-i="bag"></span><b>Túi đồ</b></button>
      </div>
      <div class="joy" id="joy"><i></i></div>
    </div>

    <div class="ticker-row chatp">
      <div class="ctabs"><button data-ch="khu" class="on">Khu</button><button data-ch="doi">Đội</button><button data-ch="phai">Phái</button><button data-ch="shop">Chợ</button><button class="soc-btn" id="soc-btn" aria-label="Giao lưu">Bạn</button></div>
      <button class="ticker" id="ticker" aria-label="Mở kênh chat"></button>
    </div>

    <nav class="nav">
      <button data-p="bag"><span class="ni" data-i="bag"></span>Túi đồ</button>
      <button data-p="char"><span class="ni" data-i="char"></span>Nhân vật</button>
      <button data-p="pet"><span class="ni" data-i="pet"></span>Tiên sủng</button>
      <button data-p="quest"><span class="ni" data-i="quest"></span>Nhiệm vụ</button>
      <button data-p="mounts"><span class="ni" data-i="mount"></span>Cưỡi</button>
      <button data-p="act"><span class="ni" data-i="act"></span>Hoạt động</button>
      <button data-p="than"><span class="ni" data-i="than3"></span>Thần sủng</button>
      <button data-p="ach"><span class="ni" data-i="ach"></span>Thành tựu</button>
      <button data-p="codex"><span class="ni" data-i="codex"></span>Đồ giám</button>
      <button data-p="nm"><span class="ni" data-i="nm"></span>Ác Mộng</button>
      <button data-p="dg"><span class="ni" data-i="dg"></span>Phó bản</button>
      <button data-p="stall"><span class="ni" data-i="stall"></span>Bày sạp</button>
    </nav>
  </section>

  <!-- ===== Chiến đấu ===== -->
  <section id="battle" hidden>
    <div class="b-bg" id="b-bg"></div>
    <canvas class="b-amb" id="b-amb"></canvas>
    <canvas class="b-3d" id="b-3d"></canvas>
    <div class="b-shade" aria-hidden="true"></div>
    <div class="b-sbanner" id="b-sbanner" aria-hidden="true"><b>Chiến Đấu</b><span></span></div>
    <div class="b-bossplate" id="b-bossplate" hidden></div>
    <div class="b-top">
      <div class="b-round" id="b-round"></div>
      <div class="b-turns" id="b-turns"></div>
      <div class="b-timer" id="b-timer"></div>
      <button class="b-auto" id="b-auto">Tự động</button>
    </div>
    <div class="b-boss" id="b-boss" hidden><span id="b-boss-name"></span><div class="bar hp"><i id="b-boss-hp"></i><span id="b-boss-t"></span></div></div>
    <div class="b-stage" id="b-stage">
      <div class="b-board" aria-hidden="true"></div>
      <canvas class="b-fx under" id="b-fx-under"></canvas>
      <div class="b-units" id="b-units"></div>
      <canvas class="b-fx" id="b-fx"></canvas>
      <div class="b-cutin" id="b-cutin" hidden></div>
      <div class="b-banner" id="b-banner"></div>
      <div class="b-intro" id="b-intro" hidden></div>
    </div>
    <div class="b-dock" id="b-dock">
    <div class="b-dock-l"><div class="b-hint" id="b-hint"></div><div class="b-log" id="b-log"></div></div>
    <div class="b-cmds hex" id="b-cmds">
      <button class="seal" data-c="attack"><i data-i="attack"></i><span>Tấn công</span></button>
      <button class="seal" data-c="skill"><i data-i="skill"></i><span>Kỹ năng</span></button>
      <button class="seal" data-c="catch"><i data-i="catch"></i><span>Thu phục</span></button>
      <button class="seal" data-c="item"><i data-i="item"></i><span>Vật phẩm</span></button>
      <button class="seal" data-c="pet"><i data-i="pet"></i><span>Tiên sủng</span></button>
      <button class="seal" data-c="flee"><i data-i="flee"></i><span>Bỏ chạy</span></button>
      <button class="seal" data-c="defend"><i data-i="defend"></i><span>Phòng thủ</span></button>
    </div>
    </div>
  </section>

  <!-- Bảng (cuộn giấy) -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-scrim" data-close></div>
    <div class="sheet-paper ornate" role="dialog" aria-modal="true">
      <div class="rod top"></div>
      <div class="sheet-head"><h3 id="sheet-title"></h3><button class="x" data-close aria-label="Đóng">✕</button></div>
      <div class="sheet-tabs" id="sheet-tabs"></div>
      <div class="sheet-body" id="sheet-body"></div>
      <div class="rod bottom"></div>
    </div>
  </div>

  <!-- Hội thoại NPC -->
  <div id="dialog" class="dialog" hidden>
    <div class="dlg-box ornate">
      <div class="dlg-who"><span class="dlg-ico" id="dlg-ico"></span><b id="dlg-name"></b></div>
      <p class="dlg-text" id="dlg-text"></p>
      <div class="dlg-opts" id="dlg-opts"></div>
    </div>
  </div>

  <!-- Hộp thoại kết quả / xác nhận -->
  <div id="modal" class="modal" hidden><div class="modal-card ornate" id="modal-card"></div></div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="netbar" class="netbar" hidden>Mất kết nối máy chủ – đang kết nối lại…</div>
</div>

<script src="js/prefs.js"></script>
<script src="js/net.js"></script>
<script src="js/audio.js"></script>
<script src="js/chibi.js"></script>
<script src="js/beast.js"></script>
<script src="js/pixel.js"></script>
<script src="js/tiles.js"></script>
<script src="js/paint.js"></script>
<script src="js/sprites.js"></script>
<script src="js/fx.js"></script>
<script src="js/ui.js"></script>
<script src="js/puppet.js"></script>
<script src="js/living.js"></script>
<script src="js/map.js"></script>
<script src="js/battle.js"></script>
<script src="js/panels.js"></script>
<script src="js/panels2.js"></script>
<script src="js/panels3.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/title.js"></script>
<script src="js/main.js"></script>
</body>
</html>
